<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>MyTax Hub · Clear Cache</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#f4f8f6;color:#17382e;font-family:Inter,system-ui,sans-serif}.card{max-width:420px;padding:30px;border-radius:22px;background:#fff;box-shadow:0 15px 45px rgba(13,59,42,.12);text-align:center}.icon{font-size:42px;color:#047857}h1{font-size:22px;margin:16px 0 8px}p{line-height:1.6;color:#64748b}button{margin-top:14px;padding:12px 18px;border:0;border-radius:12px;background:#047857;color:#fff;font-weight:700;cursor:pointer}.done{color:#047857;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">↻</div>
    <h1>Kemaskini aplikasi</h1>
    <p id="status">Sedang membuang cache lama dan mengaktifkan versi terkini…</p>
    <button id="openApp" hidden>Buka aplikasi terkini</button>
  </main>
  <script src="/clear-cache.js"></script>
</body>
</html>
